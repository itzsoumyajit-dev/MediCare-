<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sprite Mapper</title>
    <style>
        body { margin: 20px; font-family: sans-serif; }
        .container { position: relative; display: inline-block; }
        .image { display: block; max-width: none; }
        .box {
            position: absolute;
            border: 2px solid red;
            background: rgba(255, 0, 0, 0.2);
            pointer-events: none;
        }
        /* Estimate boxes based on 7 cards */
        .box-1 { left: 30px; top: 12px; width: 70px; height: 70px; }
        .box-2 { left: 172px; top: 12px; width: 70px; height: 70px; }
        .box-3 { left: 314px; top: 12px; width: 70px; height: 70px; }
        .box-4 { left: 456px; top: 12px; width: 70px; height: 70px; }
        .box-5 { left: 598px; top: 12px; width: 70px; height: 70px; }
        .box-6 { left: 740px; top: 12px; width: 70px; height: 70px; }
        .box-7 { left: 882px; top: 12px; width: 70px; height: 70px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="icons-sprite.png" class="image">
        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
        <div class="box box-4"></div>
        <div class="box box-5"></div>
        <div class="box box-6"></div>
        <div class="box box-7"></div>
    </div>
</body>
</html>
